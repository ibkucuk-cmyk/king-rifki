<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rıfkı - Game Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="game-page">
    <!-- Top Bar -->
    <div class="game-top-bar">
        <div class="top-bar-left">
            <span class="round-badge" id="round-badge">Round 0/20</span>
            <span class="contract-badge" id="contract-badge">—</span>
        </div>
        <div class="top-bar-center"><h1 class="top-title">🃏 Rıfkı</h1></div>
        <div class="top-bar-right">
            <button class="btn-icon-sm" id="btn-last-trick" title="Last Trick" style="opacity:0.35;pointer-events:none;">🔍</button>
            <button class="btn-icon-sm" id="btn-scoreboard" title="Scoreboard">📊</button>
            <button class="btn-icon-sm" id="btn-leave" title="Leave Game" onclick="if(confirm('Leave this game?')) window.location.href='/'">🚪</button>
        </div>
    </div>

    <!-- Game Table -->
    <div class="game-table" id="game-table">
        <!-- Top player (seat 2) -->
        <div class="player-area player-top" id="player-area-2">
            <div class="player-info-box">
                <div class="player-avatar" id="avatar-2">🤖</div>
                <div class="player-text">
                    <span class="player-name" id="name-2">Player 3</span>
                    <span class="player-score" id="score-2">0</span>
                </div>
            </div>
            <div class="player-cards-back" id="cards-back-2"></div>
            <div class="penalty-cards-area" id="penalty-cards-2" style="display:none;"></div>
            <div class="turn-indicator" id="turn-2"></div>
        </div>

        <!-- Left player (seat 3) -->
        <div class="player-area player-left" id="player-area-3">
            <div class="player-info-box">
                <div class="player-avatar" id="avatar-3">🤖</div>
                <div class="player-text">
                    <span class="player-name" id="name-3">Player 4</span>
                    <span class="player-score" id="score-3">0</span>
                </div>
            </div>
            <div class="player-cards-back vertical" id="cards-back-3"></div>
            <div class="penalty-cards-area penalty-vertical" id="penalty-cards-3" style="display:none;"></div>
            <div class="turn-indicator" id="turn-3"></div>
        </div>

        <!-- Right player (seat 1) -->
        <div class="player-area player-right" id="player-area-1">
            <div class="player-info-box">
                <div class="player-avatar" id="avatar-1">🤖</div>
                <div class="player-text">
                    <span class="player-name" id="name-1">Player 2</span>
                    <span class="player-score" id="score-1">0</span>
                </div>
            </div>
            <div class="player-cards-back vertical" id="cards-back-1"></div>
            <div class="penalty-cards-area penalty-vertical" id="penalty-cards-1" style="display:none;"></div>
            <div class="turn-indicator" id="turn-1"></div>
        </div>

        <!-- Center trick area -->
        <div class="trick-area" id="trick-area">
            <div class="trick-card-slot" id="trick-slot-2"></div>
            <div class="trick-middle-row">
                <div class="trick-card-slot" id="trick-slot-3"></div>
                <div class="trick-center-info" id="trick-info"></div>
                <div class="trick-card-slot" id="trick-slot-1"></div>
            </div>
            <div class="trick-card-slot" id="trick-slot-0"></div>
        </div>

        <!-- Bottom player (you - seat 0) -->
        <div class="player-area player-bottom" id="player-area-0">
            <div class="turn-indicator" id="turn-0"></div>
            <div class="penalty-cards-area" id="penalty-cards-0" style="display:none;"></div>
            <div class="player-hand" id="player-hand"></div>
            <div class="player-info-box bottom-info">
                <div class="player-avatar you-avatar" id="avatar-0">👤</div>
                <div class="player-text">
                    <span class="player-name" id="name-0">You</span>
                    <span class="player-score" id="score-0">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Contract Selection Modal -->
    <div class="modal-overlay" id="contract-modal" style="display:none;">
        <div class="modal-card glass-card">
            <h2>🎯 Choose Your Contract</h2>
            <p class="modal-subtitle">Round <span id="modal-round">1</span>/20</p>
            <div class="contract-grid" id="contract-grid"></div>
        </div>
    </div>

    <!-- Trump Suit Selection -->
    <div class="modal-overlay" id="trump-modal" style="display:none;">
        <div class="modal-card glass-card">
            <h2>♠ Choose Trump Suit</h2>
            <div class="suit-grid">
                <button class="suit-btn" data-suit="spades"><span class="suit-symbol spades">♠</span><span>Spades</span></button>
                <button class="suit-btn" data-suit="hearts"><span class="suit-symbol hearts">♥</span><span>Hearts</span></button>
                <button class="suit-btn" data-suit="diamonds"><span class="suit-symbol diamonds">♦</span><span>Diamonds</span></button>
                <button class="suit-btn" data-suit="clubs"><span class="suit-symbol clubs">♣</span><span>Clubs</span></button>
            </div>
        </div>
    </div>

    <!-- Round End Modal -->
    <div class="modal-overlay blur-bg" id="round-end-modal" style="display:none;">
        <div class="modal-card glass-card round-end">
            <h2 id="round-end-title">Round Complete!</h2>
            <div class="round-scores" id="round-scores-display"></div>
            <button class="btn-primary" id="btn-next-round"><span class="btn-icon">▶</span> Next Round</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay blur-bg" id="game-over-modal" style="display:none;">
        <div class="modal-card glass-card game-over">
            <div class="trophy">🏆</div>
            <h2 id="winner-text">Game Over!</h2>
            <div class="final-scores" id="final-scores"></div>
            <button class="btn-primary" onclick="window.location.href='/'"><span class="btn-icon">🏠</span> New Game</button>
        </div>
    </div>

    <!-- Scoreboard Modal -->
    <div class="modal-overlay blur-bg" id="scoreboard-modal" style="display:none;">
        <div class="scoreboard-modal-card glass-card">
            <div class="sb-modal-header"><h2>📊 Scoreboard</h2><button class="btn-close" id="btn-close-scoreboard">✕</button></div>
            <div class="scoreboard-content" id="scoreboard-content">
                <p style="text-align:center;color:var(--text-dim);padding:40px;font-size:16px;">No rounds played yet</p>
            </div>
        </div>
    </div>

    <!-- Last Trick Modal -->
    <div class="modal-overlay blur-bg" id="last-trick-modal" style="display:none;">
        <div class="last-trick-modal-card glass-card">
            <div class="lt-modal-header"><h2>🔍 Trick History</h2><button class="btn-close" id="btn-close-last-trick">✕</button></div>
            <div class="lt-content" id="last-trick-content"></div>
        </div>
    </div>

    <!-- Misdeal Toast -->
    <div class="toast" id="misdeal-toast" style="display:none;">
        <span class="toast-icon">🔄</span><span class="toast-text" id="misdeal-text"></span>
    </div>

    <!-- Notification -->
    <div class="game-notification" id="game-notification" style="display:none;">
        <span id="notification-text"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
