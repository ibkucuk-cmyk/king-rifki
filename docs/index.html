<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rıfkı Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--bg2:#111827;--border:rgba(255,255,255,.12);--text:#e8eaf0;--dim:#7a8294;--accent:#6c5ce7;--gold:#f9ca24;--red:#e74c3c;--green:#00b894;--font:'Outfit',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(135deg,#0a0e17,#1a1040);color:var(--text);min-height:100vh;overflow:auto}
.page{max-width:1200px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:42px;font-weight:800;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--dim);font-size:20px;margin-bottom:24px}
.card{background:rgba(17,24,38,.8);border:2px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.card h2{font-size:26px;font-weight:800;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.field{flex:1;min-width:120px}
.field label{display:block;font-size:14px;color:var(--dim);margin-bottom:4px;font-weight:700;text-transform:uppercase}
.field input{width:100%;padding:14px 12px;background:rgba(0,0,0,.3);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:24px;font-weight:800;text-align:center}
.field input:focus{outline:none;border-color:var(--accent)}
.field input.gold{color:var(--gold)}
.tabs{display:flex;gap:4px;margin-bottom:0}
.tab{padding:14px 28px;border:none;border-radius:12px 12px 0 0;font-family:var(--font);font-size:20px;font-weight:800;cursor:pointer;transition:.2s;background:rgba(255,255,255,.05);color:var(--dim)}
.tab.active{background:rgba(108,92,231,.2);color:var(--accent);border-bottom:3px solid var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.grid-table{width:100%;border-collapse:collapse;border:2px solid var(--border);overflow:hidden}
.grid-table th,.grid-table td{padding:14px 10px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.grid-table thead th{background:var(--bg2);font-size:22px;font-weight:800;color:var(--gold)}
.section-row td{background:rgba(108,92,231,.12);color:var(--accent);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:2px;padding:14px 16px!important;text-align:left!important;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)}
.contract-label{text-align:left!important;padding-left:16px!important;font-size:22px;font-weight:700;background:var(--bg2);white-space:nowrap}
.contract-label .unit{display:block;font-size:13px;color:var(--dim);font-weight:500}
.count-cell{padding:6px!important}
.count-cell input{width:100%;padding:12px 4px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text);font-family:var(--font);font-size:28px;font-weight:800;text-align:center}
.count-cell input:focus{outline:none;border-color:var(--accent)}
.count-cell input.err{border-color:var(--red)!important;background:rgba(231,76,60,.15)!important}
.count-cell .sd{font-size:16px;font-weight:700;margin-top:4px;min-height:20px}
.sd.neg{color:var(--red)}.sd.pos{color:var(--green)}
.enter-cell{padding:6px 8px!important}
.enter-btn{padding:12px 16px;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);font-size:18px;font-weight:800;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;white-space:nowrap;transition:.2s}
.enter-btn:hover{transform:translateY(-1px)}
.enter-btn.locked{background:rgba(0,184,148,.3);color:var(--green);cursor:default}
.row-locked .count-cell input{background:transparent;border-color:transparent;pointer-events:none}
.row-error{color:var(--red);font-size:14px;font-weight:700;display:none;margin-top:4px}
.row-error.show{display:block}
.summary-row td{background:rgba(0,0,0,.5);font-size:26px;font-weight:800;padding:16px 10px!important}
.neg-val{color:var(--red)}.pos-val{color:var(--green)}
.balance-row td{font-size:32px!important;border-top:4px solid var(--gold)!important}
.bal-pos{color:var(--green)}.bal-neg{color:var(--red)}.bal-zero{color:var(--dim)}
.settle-box{padding:20px;border-radius:14px;margin-top:12px}
.settle-item{padding:16px;margin-bottom:10px;border-radius:12px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:12px}
.settle-item.owes{background:rgba(231,76,60,.1);border:2px solid var(--red);color:var(--red)}
.settle-item.gets{background:rgba(0,184,148,.1);border:2px solid var(--green);color:var(--green)}
.settle-item.even{background:rgba(255,255,255,.05);border:2px solid var(--dim);color:var(--dim)}
.btn{padding:14px 32px;border:none;border-radius:12px;font-family:var(--font);font-size:20px;font-weight:700;cursor:pointer;transition:.2s;margin:6px}
.btn-green{background:linear-gradient(135deg,#00b894,#00cec9);color:#fff}
.btn-red{border:2px solid var(--red);background:transparent;color:var(--red)}
.btn-purple{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff}
.btn:hover{transform:translateY(-2px)}
.btn-row{text-align:center;margin-top:20px}
.winner-tag{display:inline-block;padding:4px 12px;border-radius:8px;font-size:14px;font-weight:800;margin-left:8px}
.winner-tag.w{background:rgba(0,184,148,.2);color:var(--green)}
.winner-tag.l{background:rgba(231,76,60,.2);color:var(--red)}
@media(max-width:900px){.count-cell input{font-size:20px}.contract-label{font-size:18px!important}.summary-row td{font-size:20px}.balance-row td{font-size:26px!important}.field input{font-size:18px}h1{font-size:32px}}
</style>
</head>
<body>
<div class="page">
<h1>🃏 Rıfkı Night</h1>
<p class="sub">Scoreboard + Food Settlement</p>

<!-- EXPENSES -->
<div class="card" id="expenseCard">
<h2>🍕 Food &amp; Expenses</h2>
<div class="row" id="expenseRow">
<div class="field" style="flex:1"><label>Name</label><input type="text" id="ename0" value="" placeholder="Name" onfocus="this.select()" oninput="save()"></div>
<div class="field" style="flex:.6"><label>$ Spent</label><input type="number" id="exp0" value="0" min="0" placeholder="$0" class="gold" onfocus="this.select()" oninput="updateExp()"></div>
<div class="field" style="flex:1"><label>Name</label><input type="text" id="ename1" value="" placeholder="Name" onfocus="this.select()" oninput="save()"></div>
<div class="field" style="flex:.6"><label>$ Spent</label><input type="number" id="exp1" value="0" min="0" placeholder="$0" class="gold" onfocus="this.select()" oninput="updateExp()"></div>
<div class="field" style="flex:1"><label>Name</label><input type="text" id="ename2" value="" placeholder="Name" onfocus="this.select()" oninput="save()"></div>
<div class="field" style="flex:.6"><label>$ Spent</label><input type="number" id="exp2" value="0" min="0" placeholder="$0" class="gold" onfocus="this.select()" oninput="updateExp()"></div>
<div class="field" style="flex:1"><label>Name</label><input type="text" id="ename3" value="" placeholder="Name" onfocus="this.select()" oninput="save()"></div>
<div class="field" style="flex:.6"><label>$ Spent</label><input type="number" id="exp3" value="0" min="0" placeholder="$0" class="gold" onfocus="this.select()" oninput="updateExp()"></div>
</div>
<div style="text-align:center;margin-top:8px">
<span style="font-size:22px;font-weight:800">Total: $<span id="totalExp">0</span></span>
<span style="margin-left:20px;font-size:18px;color:var(--dim)">Per game: $<span id="perGame">0</span></span>
</div>
</div>

<!-- TABS -->
<div class="tabs">
<button class="tab active" onclick="switchTab(0)" id="tab0">🎮 Game 1 <span style="font-size:14px;opacity:.7">(0/20)</span></button>
<button class="tab" onclick="switchTab(1)" id="tab1">🎮 Game 2 <span style="font-size:14px;opacity:.7">(0/20)</span></button>
<button class="tab" onclick="switchTab(2)">💰 Settlement</button>
</div>

<div class="tab-content active" id="tc0"></div>
<div class="tab-content" id="tc1"></div>
<div class="tab-content" id="tc2">
<div class="card"><h2>💰 Settlement — Who Owes Who</h2>
<button class="btn btn-purple" onclick="calcSettle()" style="margin-bottom:16px">Calculate Settlement</button>
<div id="settleResult"><p style="color:var(--dim);font-size:18px">Finish both games and click Calculate.</p></div>
</div>
</div>
</div>

<script>
const NAMES=['Player 1','Player 2','Player 3','Player 4'];
const NEG=[
{id:'girls1',name:'Kız (1)',unit:'-100 × Queen (max 4)',pu:-100,max:4},
{id:'girls2',name:'Kız (2)',unit:'-100 × Queen (max 4)',pu:-100,max:4},
{id:'boys1',name:'Erkek (1)',unit:'-60 × Boy (max 8)',pu:-60,max:8},
{id:'boys2',name:'Erkek (2)',unit:'-60 × Boy (max 8)',pu:-60,max:8},
{id:'hearts1',name:'Kupa (1)',unit:'-30 × Heart (max 13)',pu:-30,max:13},
{id:'hearts2',name:'Kupa (2)',unit:'-30 × Heart (max 13)',pu:-30,max:13},
{id:'rifki1',name:'Rıfkı (1)',unit:'-320 × K♥ (max 1)',pu:-320,max:1},
{id:'rifki2',name:'Rıfkı (2)',unit:'-320 × K♥ (max 1)',pu:-320,max:1},
{id:'last1',name:'Son İki (1)',unit:'-180 × trick (max 2)',pu:-180,max:2},
{id:'last2',name:'Son İki (2)',unit:'-180 × trick (max 2)',pu:-180,max:2},
{id:'notr1',name:'El Almaz (1)',unit:'-50 × trick (max 13)',pu:-50,max:13},
{id:'notr2',name:'El Almaz (2)',unit:'-50 × trick (max 13)',pu:-50,max:13}
];
const TRUMP=[];for(let i=1;i<=8;i++)TRUMP.push({id:'koz'+i,name:'Koz '+i,unit:'+50 × trick (max 13)',pu:50,max:13,t:1});
const ALL=[...NEG,...TRUMP];
const games=[{rows:{}},{rows:{}}];

// Expenses are built in HTML now

function updateExp(){
let t=0;for(let p=0;p<4;p++)t+=Math.max(0,parseInt(document.getElementById('exp'+p).value)||0);
document.getElementById('totalExp').textContent=t;
document.getElementById('perGame').textContent=(t/2).toFixed(2);
save();
}

// Build game scoreboards
function buildGame(gi){
const container=document.getElementById('tc'+gi);
const tbl=document.createElement('table');tbl.className='grid-table';
let h='<thead><tr><th style="min-width:160px">Contract</th>';
for(let p=0;p<4;p++)h+=`<th style="padding:0"><input type="text" id="g${gi}_name${p}" value="Player ${p+1}" placeholder="Player ${p+1}" style="width:100%;padding:14px 8px;background:rgba(0,0,0,.4);border:none;color:var(--gold);font-family:var(--font);font-size:22px;font-weight:800;text-align:center" onfocus="this.select()" oninput="save()"></th>`;
h+='<th style="width:80px"></th></tr></thead><tbody>';
h+='<tr class="section-row"><td colspan="6">❌ NEGATIVES</td></tr>';
NEG.forEach(c=>{h+=mkRow(gi,c)});
h+='<tr class="section-row"><td colspan="6">👑 TRUMP (Koz)</td></tr>';
TRUMP.forEach(c=>{h+=mkRow(gi,c)});
h+=`<tr class="section-row"><td colspan="6">📊 TOTALS</td></tr>`;
h+=sumRow(gi,'neg','− Negatives','neg-val');
h+=sumRow(gi,'pos','+ Positives','pos-val');
h+=`<tr class="summary-row balance-row"><td class="contract-label" style="font-size:24px;color:var(--gold)">BALANCE</td>`;
for(let p=0;p<4;p++)h+=`<td id="g${gi}_bal_p${p}" class="bal-zero">0</td>`;
h+='<td></td></tr></tbody>';
tbl.innerHTML=h;container.appendChild(tbl);
const br=document.createElement('div');br.className='btn-row';
br.innerHTML=`<button class="btn btn-red" onclick="resetGame(${gi})">🗑 Reset Game ${gi+1}</button>`;
container.appendChild(br);
ALL.forEach(c=>{games[gi].rows[c.id]={locked:false,counts:[0,0,0,0],scores:[0,0,0,0]}});
}

function mkRow(gi,c){
const rid=`g${gi}_${c.id}`;
let h=`<tr id="row-${rid}" class="data-row"><td class="contract-label">${c.name}<span class="unit">${c.unit}</span></td>`;
for(let p=0;p<4;p++){
h+=`<td class="count-cell ${c.t?'trump-cell':''}"><input type="number" min="0" max="${c.max}" id="${rid}_p${p}" placeholder="—" onfocus="this.select()" onkeydown="if(event.key==='Enter'){event.preventDefault();enterR('${rid}',${gi},'${c.id}')}"><div class="sd" id="${rid}_s${p}"></div></td>`;
}
h+=`<td class="enter-cell"><button class="enter-btn" id="btn-${rid}" onclick="enterR('${rid}',${gi},'${c.id}')">Enter</button><div class="row-error" id="err-${rid}"></div></td></tr>`;
return h;
}

function sumRow(gi,pre,label,cls){
let h=`<tr class="summary-row"><td class="contract-label" style="font-size:20px">${label}</td>`;
for(let p=0;p<4;p++)h+=`<td class="${cls}" id="g${gi}_${pre}_p${p}">0</td>`;
return h+'<td></td></tr>';
}

function enterR(rid,gi,cid){
const c=ALL.find(x=>x.id===cid);if(!c)return;
const rd=games[gi].rows[cid];
if(rd.locked){unlockR(rid,gi,cid);return}
let total=0;const counts=[];
for(let p=0;p<4;p++){const v=Math.max(0,parseInt(document.getElementById(rid+'_p'+p).value)||0);counts.push(v);total+=v}
const errEl=document.getElementById('err-'+rid);
if(total!==c.max){
errEl.textContent=total>c.max?`❌ Total ${total} > max ${c.max}!`:`❌ Total ${total} ≠ ${c.max}!`;
errEl.classList.add('show');
for(let p=0;p<4;p++)document.getElementById(rid+'_p'+p).classList.add('err');
setTimeout(()=>{errEl.classList.remove('show');for(let p=0;p<4;p++)document.getElementById(rid+'_p'+p).classList.remove('err')},3000);
return}
rd.counts=counts;
for(let p=0;p<4;p++){
rd.scores[p]=counts[p]*c.pu;
const s=document.getElementById(rid+'_s'+p);
s.textContent=rd.scores[p]?`= ${rd.scores[p]>0?'+':''}${rd.scores[p]}`:'= 0';
s.className='sd '+(rd.scores[p]<0?'neg':rd.scores[p]>0?'pos':'');
}
rd.locked=true;document.getElementById('row-'+rid).classList.add('row-locked');
const btn=document.getElementById('btn-'+rid);btn.textContent='✓ Edit';btn.classList.add('locked');
errEl.classList.remove('show');recalc(gi);updateTabProgress();save();
}

function unlockR(rid,gi,cid){
const rd=games[gi].rows[cid];rd.locked=false;
document.getElementById('row-'+rid).classList.remove('row-locked');
const btn=document.getElementById('btn-'+rid);btn.textContent='Enter';btn.classList.remove('locked');
for(let p=0;p<4;p++)document.getElementById(rid+'_s'+p).textContent='';
}

function recalc(gi){
let neg=[0,0,0,0],pos=[0,0,0,0];
Object.entries(games[gi].rows).forEach(([id,rd])=>{
if(!rd.locked)return;
for(let p=0;p<4;p++){if(rd.scores[p]<0)neg[p]+=rd.scores[p];else pos[p]+=rd.scores[p]}
});
for(let p=0;p<4;p++){
document.getElementById(`g${gi}_neg_p${p}`).textContent=neg[p];
document.getElementById(`g${gi}_pos_p${p}`).textContent='+'+pos[p];
const bal=neg[p]+pos[p];
const el=document.getElementById(`g${gi}_bal_p${p}`);
el.textContent=(bal>0?'+':'')+bal;
el.className=bal>0?'bal-pos':bal<0?'bal-neg':'bal-zero';
}
}

function resetGame(gi){
if(!confirm('Reset Game '+(gi+1)+'?'))return;
ALL.forEach(c=>{
const rid=`g${gi}_${c.id}`;
const rd=games[gi].rows[c.id];rd.locked=false;rd.counts=[0,0,0,0];rd.scores=[0,0,0,0];
const tr=document.getElementById('row-'+rid);if(tr)tr.classList.remove('row-locked');
const btn=document.getElementById('btn-'+rid);if(btn){btn.textContent='Enter';btn.classList.remove('locked')}
for(let p=0;p<4;p++){
const inp=document.getElementById(rid+'_p'+p);if(inp){inp.value='';inp.classList.remove('err')}
const sc=document.getElementById(rid+'_s'+p);if(sc)sc.textContent='';
}});recalc(gi);updateTabProgress();save();
}

// Tabs
function switchTab(i){
document.querySelectorAll('.tab').forEach((t,j)=>{t.classList.toggle('active',j===i)});
document.querySelectorAll('.tab-content').forEach((t,j)=>{t.classList.toggle('active',j===i)});
}

// Sync player names
function syncNames(){
const names=[];
for(let p=0;p<4;p++){
const n=document.getElementById('exp'+p).previousElementSibling||document.getElementById('elbl'+p);
names.push(n?n.textContent:'Player '+(p+1));
}
}

// Progress tracking
function getGameProgress(gi){
let count=0;Object.values(games[gi].rows).forEach(rd=>{if(rd.locked)count++});return count;
}
function updateTabProgress(){
for(let gi=0;gi<2;gi++){
const count=getGameProgress(gi);
document.getElementById('tab'+gi).innerHTML=`🎮 Game ${gi+1} <span style="font-size:14px;opacity:.7">(${count}/20)</span>`;
}}

// Settlement
function calcSettle(){
const enames=[];const spent=[];
for(let p=0;p<4;p++){
enames.push(document.getElementById('ename'+p).value||'Person '+(p+1));
spent.push(Math.max(0,parseInt(document.getElementById('exp'+p).value)||0));
}
const totalExp=spent.reduce((a,b)=>a+b,0);
if(totalExp===0){document.getElementById('settleResult').innerHTML='<p style="color:var(--red);font-size:20px">Enter food expenses first!</p>';return}
// Get game player names
const gnames=[[],[]];
for(let gi=0;gi<2;gi++)for(let p=0;p<4;p++)gnames[gi].push(document.getElementById('g'+gi+'_name'+p).value||'Player '+(p+1));
const g1p=getGameProgress(0),g2p=getGameProgress(1);
let warnHtml='';
if(g1p<20||g2p<20){
warnHtml=`<div style="padding:14px;margin-bottom:16px;border-radius:10px;background:rgba(249,202,36,.1);border:2px solid var(--gold);color:var(--gold);font-size:18px;font-weight:700">⚠️ Games not complete! Game 1: ${g1p}/20 hands, Game 2: ${g2p}/20 hands. Settlement is only accurate after all 20 hands per game are entered.</div>`;}
const perGame=totalExp/2;
const totalPaid=[0,0,0,0];
for(let gi=0;gi<2;gi++){
const bals=[];
for(let p=0;p<4;p++){
let neg=0,pos=0;
Object.values(games[gi].rows).forEach(rd=>{if(!rd.locked)return;if(rd.scores[p]<0)neg+=rd.scores[p];else pos+=rd.scores[p]});
bals.push(neg+pos);
}
const losers=bals.map((b,i)=>b<0?i:-1).filter(i=>i>=0);
if(losers.length===0)continue;
const share=perGame/losers.length;
losers.forEach(i=>{totalPaid[i]+=share});
}
// Net: positive = owed money, negative = owes money
const net=[];
for(let p=0;p<4;p++)net.push(spent[p]-totalPaid[p]);
// Generate settlement
const debtors=[];const creditors=[];
net.forEach((n,i)=>{if(n<0)debtors.push({i,amt:Math.abs(n)});else if(n>0)creditors.push({i,amt:n})});
let html='<div style="margin-bottom:16px">';
// Game summaries
for(let gi=0;gi<2;gi++){
html+=`<div style="margin-bottom:12px;padding:12px;background:rgba(255,255,255,.03);border-radius:10px"><strong style="font-size:18px">Game ${gi+1}:</strong> `;
const bals=[];
for(let p=0;p<4;p++){let s=0;Object.values(games[gi].rows).forEach(rd=>{if(rd.locked)s+=rd.scores[p]});bals.push(s)}
for(let p=0;p<4;p++){
const tag=bals[p]<0?'l':'w';
html+=`<span style="margin:0 8px;font-size:18px">${gnames[gi][p]}: <strong style="color:${bals[p]<0?'var(--red)':'var(--green)'}">${bals[p]>0?'+':''}${bals[p]}</strong><span class="winner-tag ${tag}">${tag==='w'?'WIN':'LOSE'}</span></span>`;
}
const losers=bals.map((b,i)=>b<0?i:-1).filter(i=>i>=0);
html+=`<br><span style="font-size:16px;color:var(--dim)">${losers.length} loser(s) × $${(perGame/Math.max(1,losers.length)).toFixed(2)} each</span></div>`;
}
html+='</div>';html=warnHtml+html;
// Payments
if(debtors.length===0&&creditors.length===0){
html+='<div class="settle-item even">✅ Everyone is even!</div>';
}else{
const d=[...debtors];const c=[...creditors];
while(d.length&&c.length){
const pay=Math.min(d[0].amt,c[0].amt);
html+=`<div class="settle-item owes">💸 ${enames[d[0].i]} owes ${enames[c[0].i]} <strong>$${pay.toFixed(2)}</strong></div>`;
d[0].amt-=pay;c[0].amt-=pay;
if(d[0].amt<0.01)d.shift();
if(c[0].amt<0.01)c.shift();
}
}
document.getElementById('settleResult').innerHTML=html;
}

// Names are now input fields, no setup needed

// Save/Load
function save(){
const st={enames:[],expenses:[],gnames:[[],[]],games:[[],[]]};
for(let p=0;p<4;p++){st.enames.push(document.getElementById('ename'+p).value);st.expenses.push(document.getElementById('exp'+p).value)}
for(let gi=0;gi<2;gi++){
for(let p=0;p<4;p++)st.gnames[gi].push(document.getElementById('g'+gi+'_name'+p).value);
Object.entries(games[gi].rows).forEach(([id,rd])=>{if(rd.locked)st.games[gi].push([id,rd.counts])});
}
localStorage.setItem('rifki_night2',JSON.stringify(st));
}

function load(){
const raw=localStorage.getItem('rifki_night2');if(!raw)return;
try{
const st=JSON.parse(raw);
if(st.enames)st.enames.forEach((n,i)=>{document.getElementById('ename'+i).value=n});
if(st.expenses)st.expenses.forEach((v,i)=>{document.getElementById('exp'+i).value=v});
if(st.gnames)st.gnames.forEach((names,gi)=>{names.forEach((n,p)=>{const el=document.getElementById('g'+gi+'_name'+p);if(el)el.value=n})});
updateExp();
if(st.games){
st.games.forEach((g,gi)=>{
g.forEach(([cid,counts])=>{
const rid=`g${gi}_${cid}`;
for(let p=0;p<4;p++){const el=document.getElementById(rid+'_p'+p);if(el)el.value=counts[p]||''}
enterR(rid,gi,cid);
});
});
}
}catch(e){console.error(e)}
}

// Init
buildGame(0);buildGame(1);load();
</script>
